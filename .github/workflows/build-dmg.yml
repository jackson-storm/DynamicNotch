
name: Build DynamicNotch DMG

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-timer-add-pomodoro

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project DynamicNotch.xcodeproj \
            -scheme DynamicNotch

      - name: Build unsigned Release app
        run: |
          xcodebuild build \
            -project DynamicNotch.xcodeproj \
            -scheme DynamicNotch \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Ad-hoc sign and create DMG
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/DynamicNotch.app"
          test -d "$APP"
          codesign --force --deep --sign - "$APP"
          mkdir -p "$RUNNER_TEMP/dmg-root" dist
          ditto "$APP" "$RUNNER_TEMP/dmg-root/DynamicNotch.app"
          ln -s /Applications "$RUNNER_TEMP/dmg-root/Applications"
          hdiutil create \
            -volname "DynamicNotch" \
            -srcfolder "$RUNNER_TEMP/dmg-root" \
            -ov \
            -format UDZO \
            "dist/DynamicNotch.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch-DMG
          path: dist/DynamicNotch.dmg
          if-no-files-found: error
          retention-days: 30
